<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<title>EDEN BEAUTY – קורס הרמת ריסים וגבות – מודעה</title>
<!--
  Vertical 1080x1920 ad. One paused GSAP timeline; render.mjs seeks it frame by frame.
  ?len=15 (default) | 10   – the scene lengths scale, the content stays the same.
  ?logo=img/logo.png       – puts your logo file in the logo slot instead of the EDEN BEAUTY wordmark.
  ?play=1                  – plays in real time for review.
  Safe zone (Meta Reels/Stories): all text sits between 14% and 65% of the height.
-->
<style>
  @font-face { font-family: Bellefair; src: url(node_modules/@fontsource/bellefair/files/bellefair-hebrew-400-normal.woff2) format('woff2'); }
  @font-face { font-family: Bellefair; src: url(node_modules/@fontsource/bellefair/files/bellefair-latin-400-normal.woff2) format('woff2'); unicode-range: U+0000-00FF; }
  @font-face { font-family: Assistant; font-weight: 500; src: url(node_modules/@fontsource/assistant/files/assistant-hebrew-500-normal.woff2) format('woff2'); }
  @font-face { font-family: Assistant; font-weight: 700; src: url(node_modules/@fontsource/assistant/files/assistant-hebrew-700-normal.woff2) format('woff2'); }
  @font-face { font-family: Assistant; font-weight: 800; src: url(node_modules/@fontsource/assistant/files/assistant-hebrew-800-normal.woff2) format('woff2'); }
  @font-face { font-family: Assistant; font-weight: 700; src: url(node_modules/@fontsource/assistant/files/assistant-latin-700-normal.woff2) format('woff2'); unicode-range: U+0000-00FF; }

  :root { --cream: #fbf5ee; --cream2: #f3e7da; --nude: #e9cfc0; --nude2: #d7b19c; --gold: #c9a35e; --gold2: #e8cf98; --ink: #3b2a2c; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 1080px; height: 1920px; overflow: hidden; background: var(--cream); }
  body { font-family: Assistant, sans-serif; color: var(--ink); -webkit-font-smoothing: antialiased; }
  #stage { position: absolute; inset: 0; overflow: hidden; perspective: 2200px; background: radial-gradient(90% 60% at 70% 20%, #fffaf4, var(--cream) 55%, var(--cream2)); }
  .scene { position: absolute; inset: 0; opacity: 0; transform-style: preserve-3d; }
  .fill { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }

  /* gold text */
  .gold { background: linear-gradient(100deg, #a8803f 0%, #e9d29e 28%, #c9a35e 48%, #f3e2b8 62%, #a8803f 100%); background-size: 220% 100%;
    -webkit-background-clip: text; background-clip: text; color: transparent; }
  .goldl { background-image: linear-gradient(100deg, #f6e3b4 0%, #fff6dc 30%, #ecd29a 50%, #fff3d2 65%, #e7c98a 100%); filter: drop-shadow(0 4px 18px rgba(40,20,20,.5)); }
  .cap { position: absolute; left: 70px; right: 70px; text-align: center; z-index: 20; }
  .cap .l { display: block; overflow: hidden; padding: 6px 0; }
  .cap .l > span { display: inline-block; }
  .h1 { font: 400 132px/1.06 Bellefair, serif; letter-spacing: -.005em; }
  .h2 { font: 400 104px/1.1 Bellefair, serif; }
  .sub { font: 700 54px/1.3 Assistant, sans-serif; letter-spacing: .01em; }
  .kick { font: 400 34px/1 Bellefair, serif; letter-spacing: .5em; color: var(--gold); direction: ltr; }
  .light { color: #fff; text-shadow: 0 4px 30px rgba(40, 20, 20, .45); }

  /* logo slot */
  .logo { position: absolute; top: 290px; left: 0; right: 0; text-align: center; z-index: 25; direction: ltr; }
  .logo .wm { font: 400 64px/1 Bellefair, serif; letter-spacing: .32em; padding-left: .32em; }
  .logo .rule { width: 160px; height: 2px; margin: 18px auto 0; background: linear-gradient(90deg, transparent, var(--gold), transparent); }
  .logo img { height: 120px; width: auto; }

  /* ---------- scene 1: lash close-up ---------- */
  #s1 .cam { position: absolute; inset: -6%; transform-style: preserve-3d; }
  #s1 .shade { position: absolute; inset: 0; background: linear-gradient(180deg, rgba(30, 18, 16, .55) 0%, rgba(30, 18, 16, .05) 38%, rgba(30, 18, 16, 0) 60%, rgba(30, 18, 16, .35) 100%); }
  #s1 svg { position: absolute; inset: 0; width: 100%; height: 100%; }
  .trace { fill: none; stroke: url(#goldline); stroke-linecap: round; filter: url(#glow); }
  .glint { position: absolute; width: 70px; height: 70px; margin: -35px 0 0 -35px; opacity: 0;
    background: radial-gradient(circle, #fff 0 6%, rgba(255, 240, 200, .9) 12%, rgba(233, 207, 152, .35) 30%, transparent 62%); }
  .glint::before, .glint::after { content: ""; position: absolute; left: 50%; top: 50%; width: 120px; height: 3px; margin: -1.5px 0 0 -60px;
    background: linear-gradient(90deg, transparent, #fff, transparent); }
  .glint::after { transform: rotate(90deg); }
  .sweep { position: absolute; inset: -20%; background: linear-gradient(115deg, transparent 42%, rgba(255, 244, 220, .55) 50%, transparent 58%); mix-blend-mode: screen; }

  /* ---------- scene 2: 3D results carousel ---------- */
  #s2 .ring { position: absolute; left: 50%; top: 1250px; width: 0; height: 0; transform-style: preserve-3d; }
  #s2 .card { position: absolute; width: 430px; height: 580px; left: -215px; top: -290px; border-radius: 34px; overflow: hidden; backface-visibility: hidden;
    box-shadow: 0 40px 80px rgba(80, 50, 40, .28), 0 0 0 2px rgba(201, 163, 94, .55); }
  #s2 .card img { width: 100%; height: 100%; object-fit: cover; }
  #s2 .floor { position: absolute; left: 140px; right: 140px; top: 1610px; height: 70px; border-radius: 50%; background: radial-gradient(closest-side, rgba(120, 80, 60, .28), transparent); filter: blur(8px); }

  /* ---------- scene 3: two days ---------- */
  #s3 .p { position: absolute; border-radius: 36px; overflow: hidden; box-shadow: 0 40px 90px rgba(80, 50, 40, .3), 0 0 0 2px rgba(201, 163, 94, .5); transform-style: preserve-3d; }
  #s3 .p img { width: 100%; height: 100%; object-fit: cover; }
  #s3 .pa { width: 620px; height: 780px; left: 60px; top: 760px; }
  #s3 .pb { width: 470px; height: 590px; right: 50px; top: 1010px; }
  .chip { position: absolute; z-index: 22; display: flex; align-items: center; gap: 22px; padding: 26px 40px 26px 34px; border-radius: 999px;
    background: rgba(255, 251, 245, .94); box-shadow: 0 20px 50px rgba(80, 50, 40, .22), inset 0 0 0 2px rgba(201, 163, 94, .6); }
  .chip b { font: 400 62px/1 Bellefair, serif; color: var(--gold); direction: ltr; }
  .chip span { font: 700 48px/1.2 Assistant, sans-serif; }
  .chip i { width: 2px; height: 46px; background: rgba(201, 163, 94, .6); }

  /* ---------- scene 4: CTA ---------- */
  #s4 .h2 { font-size: 88px; white-space: nowrap; }
  #s4 .bgimg { position: absolute; inset: 0; opacity: .22; filter: blur(2px) saturate(.8); }
  #s4 .veil { position: absolute; inset: 0; background: radial-gradient(80% 55% at 50% 42%, rgba(251, 245, 238, .96) 0%, rgba(251, 245, 238, .9) 55%, rgba(243, 231, 218, .82) 100%); }
  #s4 .frame { position: absolute; left: 70px; right: 70px; top: 230px; bottom: 560px; border: 2px solid rgba(201, 163, 94, .75); border-radius: 46px; }
  #s4 .frame::after { content: ""; position: absolute; inset: 14px; border: 1px solid rgba(201, 163, 94, .4); border-radius: 36px; }
  .wa { position: absolute; left: 50%; top: 1150px; transform: translateX(-50%); z-index: 22; display: flex; align-items: center; gap: 24px; white-space: nowrap;
    padding: 34px 64px; border-radius: 999px; color: #fff; font: 800 50px/1 Assistant, sans-serif;
    background: linear-gradient(135deg, #d9b878, #b88f4a 55%, #9c7638); box-shadow: 0 26px 60px rgba(150, 110, 50, .45), inset 0 2px 0 rgba(255, 255, 255, .45); overflow: hidden; }
  .wa svg { width: 62px; height: 62px; fill: #fff; }
  .wa .sh { position: absolute; inset: 0; background: linear-gradient(105deg, transparent 35%, rgba(255, 255, 255, .55) 50%, transparent 65%); transform: translateX(-130%); }

  /* light leak + grain for a filmic finish */
  .leak { position: absolute; width: 1400px; height: 1400px; border-radius: 50%; z-index: 30; pointer-events: none; mix-blend-mode: screen; opacity: 0;
    background: radial-gradient(circle, rgba(255, 226, 180, .85), rgba(255, 200, 160, .25) 40%, transparent 70%); }
  .flash { position: absolute; inset: 0; z-index: 31; background: #fff8ee; opacity: 0; pointer-events: none; }
  .bars { position: absolute; left: 0; right: 0; height: 0; z-index: 40; background: #000; }
</style>
</head>
<body>
<div id="stage">

  <!-- 1 · hook: lash close-up with gold tracing -->
  <section class="scene" id="s1">
    <div class="cam" id="cam1">
      <img class="fill" src="img/eye.jpg" id="eyeImg">
      <svg viewBox="0 0 657 951" preserveAspectRatio="xMidYMid slice" id="traceSvg">
        <defs>
          <linearGradient id="goldline" x1="0" x2="1"><stop offset="0" stop-color="#b98d47"/><stop offset=".5" stop-color="#fff0c8"/><stop offset="1" stop-color="#c9a35e"/></linearGradient>
          <filter id="glow" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
        </defs>
        <path class="trace" id="lashPath" stroke-width="5" d="M132 452 C 190 400, 262 380, 330 392 S 420 440, 446 512"/>
        <path class="trace" id="browPath" stroke-width="4" d="M196 292 C 270 236, 360 206, 460 222 S 600 268, 652 330"/>
      </svg>
      <div class="sweep" id="sweep1"></div>
    </div>
    <div class="shade"></div>
    <div class="glint" id="g1"></div><div class="glint" id="g2"></div><div class="glint" id="g3"></div>
    <div class="cap light" style="top:300px">
      <span class="l"><span class="h1">מחפשת מקצוע</span></span>
      <span class="l"><span class="h1">בעולם <span class="gold goldl">הביוטי?</span></span></span>
    </div>
  </section>

  <!-- 2 · course reveal: 3D carousel of real results -->
  <section class="scene" id="s2">
    <div class="floor"></div>
    <div class="ring" id="ring">
      <div class="card"><img src="img/r1.jpg"></div><div class="card"><img src="img/r5.jpg"></div><div class="card"><img src="img/r3.jpg"></div>
      <div class="card"><img src="img/r4.jpg"></div><div class="card"><img src="img/r2.jpg"></div><div class="card"><img src="img/r6.jpg"></div>
    </div>
    <div class="cap" style="top:430px">
      <span class="l"><span class="sub" style="color:#6e5557">הכירי את קורס</span></span>
      <span class="l"><span class="h2">הרמת הריסים והגבות</span></span>
      <span class="l"><span class="h2 gold" style="direction:ltr;letter-spacing:.06em">EDEN BEAUTY</span></span>
    </div>
  </section>

  <!-- 3 · two days -->
  <section class="scene" id="s3">
    <div class="p pa" id="pa"><img src="img/setup.jpg"></div>
    <div class="p pb" id="pb"><img src="img/r4.jpg"></div>
    <div class="cap" style="top:300px">
      <span class="l"><span class="h2"><span class="gold">יומיים</span> של הכשרה מקצועית</span></span>
      <span class="l"><span class="h2">ותרגול מעשי</span></span>
    </div>
    <div class="chip" id="c1" style="top:640px;right:70px"><b>01</b><i></i><span>יום עיוני והדגמה</span></div>
    <div class="chip" id="c2" style="top:800px;right:170px"><b>02</b><i></i><span>יום תרגול מעשי</span></div>
  </section>

  <!-- 4 · CTA -->
  <section class="scene" id="s4">
    <img class="fill bgimg" src="img/eyes2.jpg">
    <div class="veil"></div>
    <div class="frame" id="frame"></div>
    <div class="cap" style="top:560px">
      <span class="l"><span class="sub" style="color:var(--gold);letter-spacing:.04em" id="fact">הדרכה אישית · אחת על אחת</span></span>
      <span class="l"><span class="h2">לפרטים והרשמה</span></span>
      <span class="l"><span class="h2">שלחי לי הודעה <span class="gold">בוואטסאפ</span> 💬</span></span>
    </div>
    <div class="wa" id="wa"><svg viewBox="0 0 32 32"><path d="M16 3a13 13 0 0 0-11.2 19.6L3 29l6.6-1.7A13 13 0 1 0 16 3zm0 23.6c-2 0-4-.6-5.7-1.6l-.4-.2-3.9 1 1-3.8-.3-.4A10.6 10.6 0 1 1 16 26.6zm5.8-7.9c-.3-.2-1.9-.9-2.2-1-.3-.1-.5-.2-.7.2l-1 1.2c-.2.2-.4.2-.7.1a8.7 8.7 0 0 1-4.3-3.8c-.3-.6.3-.5 1-1.7.1-.2 0-.4 0-.5l-1-2.4c-.3-.6-.5-.5-.7-.5h-.6c-.2 0-.6.1-.9.4-.3.3-1.1 1.1-1.1 2.7s1.2 3.1 1.3 3.3c.2.2 2.3 3.5 5.5 4.9 2 .9 2.8.9 3.8.8.6-.1 1.9-.8 2.2-1.5.3-.8.3-1.4.2-1.5-.1-.2-.3-.2-.6-.4z"/></svg><span>שלחי הודעה</span><i class="sh" id="wash"></i></div>
  </section>

  <div class="logo" id="logo"><div class="wm gold">EDEN BEAUTY</div><div class="rule"></div></div>
  <div class="leak" id="leak"></div>
  <div class="flash" id="flash"></div>
  <div class="bars" id="barT" style="top:0"></div><div class="bars" id="barB" style="bottom:0"></div>
</div>

<script src="node_modules/gsap/dist/gsap.min.js"></script>
<script>
(() => {
  const q = new URLSearchParams(location.search);
  const LEN = q.get('len') === '10' ? 10 : 15;
  if (q.get('logo')) document.getElementById('logo').innerHTML = `<img src="${q.get('logo')}" alt="logo">`;
  const D = LEN === 10 ? [2, 3, 2.5, 2.5] : [3, 4, 4, 4];
  const S = D.reduce((a, d, i) => (a.push(i ? a[i - 1] + D[i - 1] : 0), a), []);
  const tl = gsap.timeline({ paused: true, defaults: { ease: 'power3.out' } });
  const $ = s => document.querySelector(s);
  const lines = id => document.querySelectorAll(`#${id} .cap .l > span`);

  // shared: logo slot shows on 2 and 4, gold shimmer on gold text throughout
  tl.fromTo('.gold', { backgroundPosition: '100% 0' }, { backgroundPosition: '-20% 0', duration: LEN, ease: 'none' }, 0);
  tl.fromTo('#logo', { opacity: 0, y: -20 }, { opacity: 1, y: 0, duration: .6 }, S[3] + .2);
  tl.fromTo('#barT, #barB', { height: 120 }, { height: 0, duration: .9, ease: 'power2.inOut' }, 0);

  // 1 · hook
  tl.set('#s1', { opacity: 1 }, 0);
  tl.fromTo('#cam1', { scale: 1.32, rotationY: -10, rotationX: 6, xPercent: 3 }, { scale: 1.08, rotationY: 6, rotationX: -2, xPercent: -2, duration: D[0] + .4, ease: 'sine.inOut' }, 0);
  ['#lashPath', '#browPath'].forEach((p, i) => {
    const el = $(p), L = el.getTotalLength(); el.style.strokeDasharray = L;
    tl.fromTo(p, { strokeDashoffset: L, opacity: 1 }, { strokeDashoffset: 0, duration: D[0] * .45, ease: 'power2.inOut' }, .35 + i * .3);
    tl.to(p, { opacity: 0, duration: .5 }, D[0] * .8);
  });
  // glints ride along the lash line and the brow
  const svg = $('#traceSvg'), img = $('#eyeImg');
  const toScreen = (path, f) => { const pt = $(path).getPointAtLength($(path).getTotalLength() * f); const m = $(path).getScreenCTM(); return { x: pt.x * m.a + m.e, y: pt.y * m.d + m.f }; };
  [['#g1', '#lashPath', .3], ['#g2', '#lashPath', .75], ['#g3', '#browPath', .55]].forEach(([g, p, f], i) => {
    const at = .7 + i * .35;
    tl.call(() => { const s = toScreen(p, f); gsap.set(g, { left: s.x, top: s.y }); }, null, at - .01);
    tl.fromTo(g, { opacity: 0, scale: .2, rotation: 0 }, { opacity: 1, scale: 1.1, rotation: 45, duration: .35, ease: 'power2.out' }, at);
    tl.to(g, { opacity: 0, scale: .4, duration: .45 }, at + .35);
  });
  tl.fromTo('#sweep1', { xPercent: -60 }, { xPercent: 60, duration: 1.3, ease: 'power2.inOut' }, D[0] * .35);
  tl.from(lines('s1'), { yPercent: 110, opacity: 0, duration: .8, stagger: .14 }, .25);
  // transition 1→2: push into the eye, light leak
  tl.to('#cam1', { scale: 1.9, duration: .55, ease: 'power3.in' }, S[1] - .5);
  tl.fromTo('#leak', { opacity: 0, x: 300, y: 500, scale: .6 }, { opacity: 1, x: -200, y: 200, scale: 1.2, duration: .5, ease: 'power2.in' }, S[1] - .45);
  tl.to('#flash', { opacity: .9, duration: .12 }, S[1] - .12);
  tl.set('#s1', { opacity: 0 }, S[1]);
  tl.to('#flash', { opacity: 0, duration: .45 }, S[1]);
  tl.to('#leak', { opacity: 0, duration: .6 }, S[1] + .05);

  // 2 · 3D carousel
  tl.set('#s2', { opacity: 1 }, S[1]);
  const cards = document.querySelectorAll('#ring .card'), R = 520;
  cards.forEach((c, i) => { c.style.transform = `rotateY(${i * 60}deg) translateZ(${R}px)`; });
  tl.fromTo('#ring', { rotationY: 40, rotationX: -14, z: -900, y: 120 }, { rotationY: -140, rotationX: -6, z: -380, y: 0, duration: D[1] + .3, ease: 'power2.out' }, S[1]);
  tl.from('#s2 .floor', { opacity: 0, duration: .8 }, S[1] + .2);
  tl.from(lines('s2'), { yPercent: 110, opacity: 0, duration: .8, stagger: .16 }, S[1] + .35);
  tl.to('#s2', { opacity: 0, duration: .35, ease: 'power2.in' }, S[2] - .3);

  // 3 · two days: dolly through layered photos
  tl.set('#s3', { opacity: 1 }, S[2]);
  tl.fromTo('#pa', { rotationY: 24, rotationX: 6, z: -500, x: -80, opacity: 0 }, { rotationY: 8, rotationX: 2, z: 0, x: 0, opacity: 1, duration: D[2] * .45, ease: 'expo.out' }, S[2]);
  tl.to('#pa', { rotationY: -2, z: 60, duration: D[2] * .6, ease: 'sine.inOut' }, S[2] + D[2] * .4);
  tl.fromTo('#pb', { rotationY: -30, z: -300, x: 160, y: 120, opacity: 0 }, { rotationY: -10, z: 120, x: 0, y: 0, opacity: 1, duration: D[2] * .5, ease: 'expo.out' }, S[2] + .25);
  tl.to('#pb', { rotationY: -2, z: 180, duration: D[2] * .5, ease: 'sine.inOut' }, S[2] + D[2] * .5);
  tl.from(lines('s3'), { yPercent: 110, opacity: 0, duration: .8, stagger: .16 }, S[2] + .2);
  gsap.set('#c1, #c2', { z: 250, scale: 0.885 });
  tl.from('#c1', { x: 260, opacity: 0, duration: .7, ease: 'back.out(1.4)' }, S[2] + D[2] * .35);
  tl.from('#c2', { x: 260, opacity: 0, duration: .7, ease: 'back.out(1.4)' }, S[2] + D[2] * .35 + .25);
  tl.to('#s3', { opacity: 0, duration: .35, ease: 'power2.in' }, S[3] - .3);

  // 4 · CTA
  tl.set('#s4', { opacity: 1 }, S[3]);
  tl.fromTo('#s4 .bgimg', { scale: 1.2 }, { scale: 1.05, duration: D[3], ease: 'sine.out' }, S[3]);
  tl.fromTo('#frame', { opacity: 0, scale: 1.06 }, { opacity: 1, scale: 1, duration: .9 }, S[3]);
  tl.from(lines('s4'), { yPercent: 110, opacity: 0, duration: .8, stagger: .15 }, S[3] + .25);
  tl.fromTo('#wa', { opacity: 0, y: 60, scale: .85 }, { opacity: 1, y: 0, scale: 1, duration: .7, ease: 'back.out(1.7)' }, S[3] + .9);
  tl.to('#wa', { scale: 1.06, duration: .35, yoyo: true, repeat: 3, ease: 'sine.inOut' }, S[3] + 1.7);
  tl.fromTo('#wash', { xPercent: -130 }, { xPercent: 130, duration: .9, ease: 'power2.inOut' }, S[3] + 1.5);
  tl.to({}, { duration: .01 }, LEN - .01);

  window.__duration = LEN;
  window.__seek = t => { tl.seek(t, false); };
  window.__ready = Promise.all([document.fonts.ready, ...[...document.images].map(i => i.decode().catch(() => {}))]).then(() => { tl.seek(0); return true; });
  if (q.get('play') === '1') window.__ready.then(() => tl.play(0));
})();
</script>
</body>
</html>
